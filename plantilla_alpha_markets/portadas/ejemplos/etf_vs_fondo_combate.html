<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- EJEMPLO · arquetipo "cartel_combate": póster de velada de boxeo, rojo contra azul. -->
<link rel="stylesheet" href="portadas/kit.css">
<style>
body{background:#000}
#p{background:#0d0d10;color:#fff;font-family:var(--f-bloque)}
#rojo{position:absolute;inset:0;background:linear-gradient(160deg,#ff2a3d,#7a0010);clip-path:polygon(0 0,100% 0,100% 38%,0 62%)}
#azul{position:absolute;inset:0;background:linear-gradient(200deg,#1f6bff,#061a57);clip-path:polygon(0 62%,100% 38%,100% 100%,0 100%)}
#rayo{position:absolute;inset:0;background:#fff;clip-path:polygon(0 61%,100% 37%,100% 39.2%,0 63.2%);box-shadow:0 0 40px #fff}
#tex{position:absolute;inset:0;opacity:.25;mix-blend-mode:overlay}
#top{position:absolute;top:250px;width:100%;text-align:center;font-family:var(--f-texto);font-weight:900;font-size:34px;letter-spacing:.35em}
#tit{position:absolute;top:300px;width:100%;text-align:center;font-size:120px;line-height:.95;text-transform:uppercase;text-shadow:0 8px 0 rgba(0,0,0,.35)}
.lu{position:absolute;font-size:330px;line-height:.85;text-transform:uppercase;text-shadow:0 18px 0 rgba(0,0,0,.4),0 0 60px rgba(0,0,0,.4)}
#etf{left:60px;top:600px;transform:rotate(-8deg)}
#fondo{right:50px;top:1110px;transform:rotate(-8deg)}
.mote{position:absolute;font-family:var(--f-mano);font-size:48px;transform:rotate(-8deg)}
#m1{left:70px;top:548px;font-size:42px}#m2{right:60px;top:1040px;text-align:right;font-size:42px}
#vs{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;background:#000;border:10px solid #FFD400;
 display:flex;align-items:center;justify-content:center;font-size:120px;color:#FFD400;transform:rotate(-8deg);box-shadow:0 0 0 10px #000,0 0 70px rgba(255,212,0,.8)}
#stats{position:absolute;left:60px;right:60px;top:1500px;display:grid;grid-template-columns:1fr auto 1fr;row-gap:10px;font-family:var(--f-texto);font-weight:900;font-size:36px;text-transform:uppercase}
#stats .c{text-align:center;font-size:26px;letter-spacing:.2em;opacity:.8;padding:0 20px;align-self:center}
#stats .r{text-align:right}
#marca{position:absolute;top:120px;width:100%;text-align:center}
</style></head><body>
<div id="p">
 <div id="rojo"></div><div id="azul"></div><div id="rayo"></div>
 <svg id="tex" width="1080" height="1920"><filter id="n"><feTurbulence baseFrequency=".9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
 <div id="marca"></div>
 <div id="top">VELADA DE TU DINERO</div>
 <div id="tit">¿Dónde metes<br>tus ahorros?</div>
 <div class="lu" id="etf">ETF</div><div class="mote" id="m1">"el de las comisiones bajas"</div>
 <div class="lu" id="fondo">Fondo</div><div class="mote" id="m2">"el que traspasa sin pagar"</div>
 <div id="vs">VS</div>
 <div id="stats">
  <span>Bolsa en directo</span><span class="c">Compra</span><span class="r">Valor liquidativo</span>
  <span>✗ Traspaso</span><span class="c">Hacienda</span><span class="r">✓ Traspaso</span>
 </div>
</div>
<script src="portadas/kit.js"></script>
<script>document.getElementById('marca').innerHTML = marca('linea', 40);</script>
</body></html>
