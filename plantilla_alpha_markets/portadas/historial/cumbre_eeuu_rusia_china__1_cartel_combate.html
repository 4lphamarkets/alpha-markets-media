<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="portadas/kit.css"><script src="portadas/kit.js"></script>
<style>
body{background:#070707}
#p{background:
 radial-gradient(ellipse 70% 40% at 50% 46%,rgba(255,59,79,.45),transparent 70%),
 repeating-conic-gradient(from 0deg at 50% 46%,rgba(255,255,255,.045) 0 4deg,transparent 4deg 10deg),#0b0b0b}
.top{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:var(--f-cifra);color:#fff;line-height:.98;letter-spacing:.01em;text-transform:uppercase}
.top .l1{font-size:170px;color:#F5C542;-webkit-text-stroke:3px #000;text-shadow:0 8px 0 #000}
.top .l2{font-size:262px;-webkit-text-stroke:4px #000;text-shadow:0 10px 0 #b3001b,0 0 60px rgba(255,59,79,.6)}
.fighter{position:absolute;text-align:center;font-family:var(--f-cifra);width:330px}
.fighter .med{width:290px;height:290px;border-radius:50%;border:12px solid #F5C542;overflow:hidden;box-shadow:0 0 0 8px #000,0 0 60px rgba(245,197,66,.55),0 24px 40px rgba(0,0,0,.7);margin:0 auto}
.fighter .med svg{display:block;width:100%;height:100%}
.fighter .nm{display:inline-block;margin-top:-30px;position:relative;background:#FF3B4F;color:#fff;font-size:70px;letter-spacing:.05em;padding:6px 34px 2px;transform:skewX(-10deg);border:5px solid #000;box-shadow:0 8px 0 #000}
.vs{position:absolute;width:140px;height:140px;border-radius:50%;background:#F5C542;border:7px solid #000;display:grid;place-items:center;font-family:var(--f-cifra);font-size:84px;color:#000;box-shadow:0 0 40px rgba(245,197,66,.7);transform:rotate(-8deg)}
.band{position:absolute;left:-30px;right:-30px;top:1452px;height:118px;background:#F5C542;transform:rotate(-2.2deg);display:flex;align-items:center;justify-content:center;gap:34px;border-top:8px solid #000;border-bottom:8px solid #000;font-family:var(--f-cifra);font-size:84px;color:#000;white-space:nowrap}
.band i{width:26px;height:26px;background:#FF3B4F;border-radius:50%;border:4px solid #000}
.mk{position:absolute;left:0;right:0;top:1598px;text-align:center}
</style></head><body><div id="p">
<div class="top"><div class="l1">LA CUMBRE</div><div class="l2">DEL SIGLO</div></div>
<div class="fighter" style="left:50px;top:745px"><div class="med" id="f1"></div><div class="nm">EEUU</div></div>
<div class="fighter" style="right:50px;top:745px"><div class="med" id="f2"></div><div class="nm">RUSIA</div></div>
<div class="vs" style="left:470px;top:800px">VS</div>
<div class="fighter" style="left:375px;top:1065px"><div class="med" id="f3" style="width:270px;height:270px"></div><div class="nm" style="margin-top:-28px">CHINA</div></div>
<div class="vs" style="left:232px;top:1120px;width:110px;height:110px;font-size:64px;transform:rotate(8deg)">VS</div>
<div class="vs" style="right:232px;top:1120px;width:110px;height:110px;font-size:64px;transform:rotate(-8deg)">VS</div>
<div class="band"><span>JUE 19 NOV</span><i></i><span>SHENZHEN</span></div>
<div class="mk" id="mk"></div>
<script>
function st(cx,cy,R,r,rot){let p=[];for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const W=(b)=>`<svg viewBox="140 0 280 280" preserveAspectRatio="xMidYMid slice">${b}</svg>`;
let us='';for(let i=0;i<13;i++)us+=`<rect x="0" y="${i*280/13}" width="560" height="${280/13+1}" fill="${i%2?'#fff':'#B22234'}"/>`;
us+='<rect width="300" height="151" fill="#3C3B6E"/>';for(let r=0;r<9;r++){const n=r%2?5:6;for(let k=0;k<n;k++)us+=`<polygon fill="#fff" points="${st((r%2?37:19)+k*36+0,14+r*15.5,6.5,2.6,-Math.PI/2)}"/>`}
document.getElementById('f1').innerHTML=W(us.replace('width="300"','width="224"'));
document.getElementById('f2').innerHTML=W('<rect width="560" height="94" fill="#fff"/><rect y="93" width="560" height="94" fill="#0039A6"/><rect y="186" width="560" height="94" fill="#D52B1E"/>');
let cn='<rect width="560" height="280" fill="#DE2910"/>';cn+=`<polygon fill="#FFDE00" points="${st(110,90,58,23,-Math.PI/2)}"/>`;[[210,32],[248,72],[248,124],[210,164]].forEach(([x,y])=>cn+=`<polygon fill="#FFDE00" points="${st(x,y,18,7.2,Math.atan2(90-y,110-x))}"/>`);
document.getElementById('f3').innerHTML=W(cn);
document.getElementById('mk').innerHTML=marca('',46);
</script></div></body></html>
