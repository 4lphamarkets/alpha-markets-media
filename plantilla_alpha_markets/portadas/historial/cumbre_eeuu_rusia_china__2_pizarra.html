<script>
function st(cx,cy,R,r,rot){let p=[];for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const W=(b)=>`<svg viewBox="140 0 280 280" preserveAspectRatio="xMidYMid slice">${b}</svg>`;
let us='';for(let i=0;i<13;i++)us+=`<rect x="0" y="${i*280/13}" width="560" height="${280/13+1}" fill="${i%2?'#fff':'#B22234'}"/>`;
us+='<rect width="224" height="151" fill="#3C3B6E"/>';for(let r=0;r<9;r++){const n=r%2?5:6;for(let k=0;k<n;k++)us+=`<polygon fill="#fff" points="${st((r%2?37:19)+k*36,14+r*15.5,6.5,2.6,-Math.PI/2)}"/>`}
document.getElementById('a').innerHTML=W(us);
document.getElementById('b').innerHTML=W('<rect width="560" height="94" fill="#fff"/><rect y="93" width="560" height="94" fill="#0039A6"/><rect y="186" width="560" height="94" fill="#D52B1E"/>');
let cn='<rect width="560" height="280" fill="#DE2910"/>';cn+=`<polygon fill="#FFDE00" points="${st(110,90,58,23,-Math.PI/2)}"/>`;[[210,32],[248,72],[248,124],[210,164]].forEach(([x,y])=>cn+=`<polygon fill="#FFDE00" points="${st(x,y,18,7.2,Math.atan2(90-y,110-x))}"/>`);
document.getElementById('c').innerHTML=W(cn);
document.getElementById('mk').innerHTML=marca('linea sin-avatar',50);
window.fit=()=>{document.querySelectorAll('.ch span').forEach(s=>{s.style.display='inline-block';ajustar(s,+s.dataset.w,+s.dataset.m,40)});return 1};fit();
</script></div></body></html>
